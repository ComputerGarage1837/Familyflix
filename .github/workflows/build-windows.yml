name: build-windows

env:
  MPV_VERSION: "20251214-git-f7be2ee"
  # using older version due to severe memory leak
  # https://qt-project.atlassian.net/browse/QTBUG-141377
  QT_VERSION: "6.9.3"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - familyflix-windows

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-x64
            qt_arch: win64_msvc2022_64
            mpv_arch: x86_64-v3
            mpv_arch_fallback: x86_64
            vc_redist_arch: x64
            vcvars: vcvars64.bat
            machine: X64
          # ARM64 disabled - requires qt webengine builds
          # - artifact: windows-arm64
          #   qt_arch: win64_msvc2022_arm64
          #   mpv_arch: aarch64
          #   mpv_arch_fallback: ""
          #   vc_redist_arch: arm64
          #   vcvars: vcvarsamd64_arm64.bat
          #   machine: ARM64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        submodules: recursive
    - uses: actions/checkout@v7
      with:
        ref: bad6de867edf4fade445365102953655689e389c
        path: desktop-web
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: desktop-web/package-lock.json
    - name: Build dedicated desktop client
      run: |
        npm ci
        npx tsc --noEmit
        npx vitest run src/familyflix src/scripts/settings/appSettings.test.js src/components/guide/livePreview.test.js
        npx eslint src/familyflix/playbackPreferences.js src/familyflix/playbackPreferences.test.js src/familyflix/nextEpisodePrompt.js src/familyflix/nextEpisodePrompt.test.js src/components/playbackSettings/playbackSettings.js src/lib/jellyfin-apiclient/ServerConnections.js
        npx eslint src/index.jsx src/familyflix/deck.js src/familyflix/deck.test.js src/familyflix/theme.js src/familyflix/theme.test.js src/familyflix/issues.js src/familyflix/cowatch.js src/familyflix/familyNight.js src/familyflix/familyNightPicker.js src/familyflix/groupDeck.js src/familyflix/homeFeed.js src/familyflix/kidsMode.js src/familyflix/profileChooser.js src/familyflix/profiles.js src/familyflix/watchlistClient.js src/familyflix/watchlistClient.test.js src/components/cardbuilder/cardBuilder.js src/components/itemContextMenu.js src/components/playback/playbackmanager.js src/components/toolbar/AppToolbar.tsx src/components/toolbar/UserMenuButton.tsx src/components/homesections/sections/familyWatchlist.js src/components/homesections/sections/nextUp.ts src/components/homesections/sections/resume.ts src/components/guide/guide.js src/components/displaySettings/displaySettings.js src/scripts/autoBackdrops.js src/scripts/libraryMenu.js src/scripts/settings/appSettings.js src/scripts/settings/appSettings.test.js src/controllers/list.js src/controllers/livetv/livetvsuggested.js src/hooks/useFetchItems.ts
        npm run build:production
      working-directory: desktop-web
    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: "${{ env.QT_VERSION }}"
        arch: "${{ matrix.qt_arch }}"
        modules: "qtwebengine qtwebchannel qtpositioning"
    - name: Validate native QML syntax
      shell: powershell
      run: |
        $formatter = Join-Path $env:QT_ROOT_DIR "bin\qmlformat.exe"
        if (-not (Test-Path -LiteralPath $formatter)) { throw "qmlformat is missing" }
        foreach ($qml in @('src/ui/webview.qml', 'src/ui/NativeAction.qml', 'src/ui/nativeview.qml')) {
          & $formatter --ignore-settings $qml > $null
          if ($LASTEXITCODE -ne 0) { throw "Invalid QML: $qml" }
        }
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: powershell
    - name: Install dependencies
      run: |
        mkdir build
        curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-${{ matrix.mpv_arch }}-${{ env.MPV_VERSION }}.7z/download > mpv.7z
        7z x mpv.7z
        mkdir mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/
        if [ -n "${{ matrix.mpv_arch_fallback }}" ]; then
          curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-${{ matrix.mpv_arch_fallback }}-${{ env.MPV_VERSION }}.7z/download > mpv-fallback.7z
          7z x mpv-fallback.7z -ompv-fallback-tmp
          mkdir build/mpv-fallback
          mv mpv-fallback-tmp/libmpv-2.dll build/mpv-fallback/
        fi
      shell: bash
    - name: Bundle VC runtime DLLs
      run: |
        mkdir deps
        mkdir deps/vcruntime
        # Dynamically locate VS installation on runner
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        if (-not $vsPath) {
            $vsPath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*" | Where-Object { Test-Path "$_\VC\Redist\MSVC" } | Select-Object -First 1).FullName
        }
        $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\${{ matrix.vc_redist_arch }}\Microsoft.VC*.CRT" | Select-Object -First 1
        if (-not $vsRedist) {
            $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter "Microsoft.VC*.CRT" | Where-Object { $_.FullName -like "*${{ matrix.vc_redist_arch }}*" } | Select-Object -First 1
        }
        Copy-Item "$vsRedist\*.dll" deps/vcruntime/
        # Also grab VCRedist installer for optional system-wide install
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile deps/vc_redist.x64.exe
      shell: powershell
    - name: Build
      run: |
        set "VS_PATH="
        for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath 2^>nul') do set "VS_PATH=%%i"
        if not defined VS_PATH (
            for /d %%d in ("C:\Program Files\Microsoft Visual Studio\*") do (
                for /d %%e in ("%%d\*") do (
                    if exist "%%e\VC\Auxiliary\Build\${{ matrix.vcvars }}" set "VS_PATH=%%e"
                )
            )
        )
        call "%VS_PATH%\VC\Auxiliary\Build\${{ matrix.vcvars }}"
        cd build
        set PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6;%CD%
        set "QT_ROOT_DIR=%QT_ROOT_DIR:\=/%"
        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DQTROOT=%QT_ROOT_DIR% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DFAMILY_FLIX_WEB_DIR=%CD%/../desktop-web/dist -DCHECK_FOR_UPDATES=ON -DUSE_STATIC_MPVQT=ON ..
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:${{ matrix.machine }}
        ninja
        ninja windows_all
      shell: cmd
    - name: Archive installer
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-installer
        path: ${{ github.workspace }}/build/Family-Flix-*.exe
    - name: Archive portable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-portable
        path: ${{ github.workspace }}/build/Family-Flix-*.zip
